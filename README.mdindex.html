<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لولي ❤️ حمزة</title>
<style>
body{
  margin:0;
  font-family: Arial;
  background:black;
  color:white;
  text-align:center;
}
input{padding:10px;margin:10px;width:250px;border-radius:10px;border:none;}
button{padding:10px 30px;border:none;border-radius:20px;background:#00ff88;font-size:16px;cursor:pointer;}
.content{display:none;padding:20px;}
.gallery img{width:200px;border-radius:15px;margin:10px;}
.music audio{margin:10px;}
.love-text{font-size:20px;margin:20px;}
</style>
</head>

<body>

<div id="loginBox">
  <h1>❤️ صفحة دخول ❤️</h1>
  <input type="text" id="username" placeholder="الاسم"><br>
  <input type="password" id="password" placeholder="الباسورد"><br>
  <button onclick="login()">دخول</button>
</div>

<div class="content" id="contentBox">
  <h1>لولي ❤️ حمزة</h1>

  <div class="love-text">
    <p>انتي مش مجرد حبيبة… انتي روحي ❤️</p>
    <p>كل يوم معاك أحلى يوم 😘</p>
    <p>أول مرة شفنا بعض فيها… ما حصلش زيها تاني 💖</p>
  </div>

  <div class="gallery">
    <img src="https://i.imgur.com/0KFBHTB.jpg">
    <img src="https://i.imgur.com/1Y2RjQZ.jpg">
    <img src="https://i.imgur.com/3XbU1Kf.jpg">
  </div>

  <div class="music">
    <audio controls><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg"></audio>
    <audio controls><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg"></audio>
  </div>
</div>

<script>
function login(){
  let user=document.getElementById("username").value;
  let pass=document.getElementById("password").value;
  if(user=="loli" && pass=="14-2"){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("contentBox").style.display="block";
  }else{
    alert("اللينك ده مش لأي حد 🖤");
  }
}
</script>

</body>
</html>
